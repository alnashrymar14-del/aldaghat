name: Android CI — Al-Daghat

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Unit tests + APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build release bundle (unsigned without signing properties)
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Decode signing keystore (optional)
        if: env.ALDAGHAT_KEYSTORE_BASE64 != ''
        env:
          ALDAGHAT_KEYSTORE_BASE64: ${{ secrets.ALDAGHAT_KEYSTORE_BASE64 }}
        run: |
          echo "$ALDAGHAT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aldaghat-release.jks"

      - name: Build signed release APK (optional)
        if: env.ALDAGHAT_KEYSTORE_BASE64 != ''
        env:
          ALDAGHAT_KEYSTORE_BASE64: ${{ secrets.ALDAGHAT_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ALDAGHAT_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALDAGHAT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALDAGHAT_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace \
            -PALDAGHAT_STORE_FILE="$RUNNER_TEMP/aldaghat-release.jks" \
            -PALDAGHAT_STORE_PASSWORD="$STORE_PASSWORD" \
            -PALDAGHAT_KEY_ALIAS="$KEY_ALIAS" \
            -PALDAGHAT_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: al-daghat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK (if signed)
        if: env.ALDAGHAT_KEYSTORE_BASE64 != ''
        env:
          ALDAGHAT_KEYSTORE_BASE64: ${{ secrets.ALDAGHAT_KEYSTORE_BASE64 }}
        uses: actions/upload-artifact@v4
        with:
          name: al-daghat-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: al-daghat-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: warn

  instrumented:
    name: Real compression tests (emulator)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests/
          if-no-files-found: warn
